<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Preserve the path to a working interaction</title>
  <desc id="desc">A conceptual comparison between a final game artifact and a preserved expert trajectory. The trajectory records task context in version zero, an edit in version one, an observed runtime failure, a correction in version two, and a successful retest. Runtime checks and expert judgment remain separately identified forms of evidence. This illustration contains no measured benchmark results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#697b52" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#242620;font-size:20px}
      .muted{fill:#686e61}.small{font-size:18px}.heading{font-size:28px;font-weight:500}.label{font-size:23px}.olive{fill:#697b52}
      .rule{fill:none;stroke:#b9bfae;stroke-width:1.5}
      .mono{font-family:Consolas,monospace;font-size:18px;fill:#697b52}
    </style>
  </defs>
  <rect width="1120" height="690" rx="8" fill="#f7f8f3"/>
  <text x="42" y="50" class="heading">Preserve the path to a working interaction.</text>
  <text x="42" y="82" class="small muted">ILLUSTRATIVE EXPERT RECORD</text>

  <!-- Left: a useful deliverable with little evidence of how it was reached. -->
  <rect x="42" y="118" width="281" height="408" rx="5" fill="#edf0e5" stroke="#c7cebb"/>
  <text x="65" y="156" class="label">Final artifact</text>
  <text x="65" y="184" class="small muted">The resulting scene</text>
  <g stroke-linejoin="round">
    <path d="M67 313 181 253 297 315 183 376Z" fill="#e3e8d6" stroke="#98a582" stroke-width="1.5"/>
    <path d="M67 313V327L183 390V376ZM183 376 297 315V329L183 390Z" fill="#c7d1b5" stroke="#98a582" stroke-width="1.5"/>
    <path d="M93 326 206 266M122 342 236 282M152 359 266 298M96 298 212 360M124 283 241 346M153 268 269 330" fill="none" stroke="#cad2bb"/>
    <path d="M196 290V219L259 253V324L247 317V263L208 242V296Z" fill="#697b52" stroke="#4f6040" stroke-width="1.5"/>
    <path d="M196 219 205 214 269 248 259 253ZM259 253 269 248V319L259 324Z" fill="#93a37d" stroke="#4f6040" stroke-width="1.5"/>
    <path d="M210 244 236 233V288L210 298Z" fill="#e5ead9" stroke="#697b52" stroke-width="1.5"/>
    <circle cx="230" cy="265" r="2.3" fill="#697b52"/>
    <path d="M134 337 133 315M145 342 147 322" stroke="#242620" stroke-width="6" stroke-linecap="round"/>
    <path d="M127 296 139 290 153 299V319L139 326 127 319Z" fill="#697b52" stroke="#4f6040" stroke-width="1.3"/>
    <path d="M130 277 139 272 151 279V291L142 296 130 289Z" fill="#f2efe4" stroke="#42483b" stroke-width="1.3"/>
  </g>
  <path d="M65 426H300" class="rule"/>
  <text x="65" y="459" class="small muted">Shows what was built.</text>
  <text x="65" y="487" class="small muted">Leaves the process implicit.</text>

  <!-- Right: versions, decisions and outcomes form an inspectable record. -->
  <text x="389" y="153" class="label">Preserved expert trajectory</text>
  <text x="389" y="181" class="small muted">Context, actions, observations, and revisions</text>
  <path d="M411 225V496" stroke="#a3ae94" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g>
    <circle cx="411" cy="226" r="8" fill="#f7f8f3" stroke="#697b52" stroke-width="2"/>
    <text x="444" y="231" class="mono">v0</text><text x="501" y="231">Context</text><text x="675" y="231" class="small muted">Make the gate open on approach.</text>
    <path d="M443 251H1077" class="rule"/>
    <circle cx="411" cy="289" r="8" fill="#697b52"/>
    <text x="444" y="294" class="mono">v1</text><text x="501" y="294">Edit</text><text x="675" y="294" class="small muted">Add a trigger and event handler.</text>
    <path d="M443 314H1077" class="rule"/>
    <circle cx="411" cy="352" r="8" fill="#f7f8f3" stroke="#a97052" stroke-width="2"/>
    <path d="M407 348 415 356M415 348 407 356" stroke="#a97052" stroke-width="1.3"/>
    <text x="444" y="357" class="mono">v1</text><text x="501" y="357">Observe failure</text><text x="675" y="357" class="small muted">The player never enters the volume.</text>
    <path d="M443 377H1077" class="rule"/>
    <circle cx="411" cy="415" r="8" fill="#697b52"/>
    <text x="444" y="420" class="mono">v2</text><text x="501" y="420">Correction</text><text x="675" y="420" class="small muted">Align the volume with the path.</text>
    <path d="M443 440H1077" class="rule"/>
    <circle cx="411" cy="478" r="8" fill="#f7f8f3" stroke="#697b52" stroke-width="2"/>
    <path d="m407 478 3 3 5-6" fill="none" stroke="#697b52" stroke-width="1.7"/>
    <text x="444" y="483" class="mono">v2</text><text x="501" y="483">Retest</text><text x="675" y="483" class="small muted">Replay the approach; inspect the gate.</text>
  </g>
  <text x="444" y="524" class="small olive">Same artifact. More evidence about how to obtain it.</text>

  <!-- Evidence types are kept separate, rather than collapsed into one score. -->
  <path d="M42 567H1078" class="rule"/>
  <g transform="translate(43 599)">
    <rect x="0" y="0" width="19" height="19" rx="2" fill="#697b52"/>
    <path d="m4 9 4 4 7-9" stroke="#f7f8f3" stroke-width="1.7" fill="none"/>
    <text x="33" y="17">Runtime checks</text>
    <text x="0" y="49" class="small muted">Did the event fire? Did the state change?</text>
  </g>
  <path d="M557 592V654" class="rule"/>
  <g transform="translate(594 599)">
    <circle cx="10" cy="10" r="9" fill="none" stroke="#697b52" stroke-width="1.8"/>
    <circle cx="10" cy="10" r="3" fill="#697b52"/>
    <text x="33" y="17">Expert judgment</text>
    <text x="0" y="49" class="small muted">Is the interaction legible and well timed?</text>
  </g>
</svg>
