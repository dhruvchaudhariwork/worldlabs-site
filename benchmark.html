  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #161616; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .home { position: absolute; top: 32px; left: 36px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 0; color: #777; text-decoration: none; font-size: 13px; }
    .home:hover { color: #111; }
    .home:focus-visible { outline: 2px solid #888; outline-offset: 6px; border-radius: 2px; }
    main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 24px; }
    .hourglass { width: 30px; height: 38px; color: #777; margin-bottom: 24px; overflow: visible; animation: turn 4s ease-in-out infinite; }
    .sand-top { transform-origin: 16px 18px; animation: empty 4s ease-in-out infinite; }
    .sand-bottom { transform-origin: 16px 29px; animation: fill 4s ease-in-out infinite; }
    .sand-stream { animation: stream 4s linear infinite; }
    h1 { font-size: 17px; font-weight: 400; letter-spacing: -.02em; margin: 0; }
    @keyframes turn { 0%, 75% { transform: rotate(0); } 95%, 100% { transform: rotate(180deg); } }
    @keyframes empty { 0%, 10% { transform: scaleY(1); } 70%, 100% { transform: scaleY(0); } }
    @keyframes fill { 0%, 10% { transform: scaleY(0); } 70%, 100% { transform: scaleY(1); } }
    @keyframes stream { 0%, 8%, 74%, 100% { opacity: 0; } 12%, 68% { opacity: .6; } }
    @media (max-width: 600px) { .home { top: 20px; left: 24px; } }
    @media (prefers-reduced-motion: reduce) { .hourglass, .sand-top, .sand-bottom, .sand-stream { animation: none; } .sand-bottom { transform: scaleY(.4); } .sand-stream { opacity: 0; } }
  </style>
