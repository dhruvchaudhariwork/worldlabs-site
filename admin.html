<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Community Inbox | World Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.ico?v=20261001-mark" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg?v=20261001-mark" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261001-mark" sizes="180x180">

<style>
  body { background: var(--color-bg-alt); }

  /* ── Login gate ── */
  .ad-gate {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: var(--space-6);
  }
  .ad-gate-card {
    width: 100%;
    max-width: 360px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-8);
  }
  .ad-gate-kicker {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: var(--space-3);
  }
  .ad-gate-title {
    font-size: var(--text-lg);
    font-weight: 500;
    letter-spacing: var(--tracking-tight);
    margin-bottom: var(--space-6);
  }
  .ad-input {
    width: 100%;
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-bg);
    font-size: var(--text-sm);
    outline: none;
  }
  .ad-input:focus { border-color: var(--color-text); }
  .ad-gate .btn { width: 100%; justify-content: center; margin-top: var(--space-4); }
  .ad-gate-err {
    font-size: var(--text-xs);
    color: var(--color-error);
    margin-top: var(--space-3);
    min-height: 1em;
  }

  /* ── Shell ── */
  .ad-app { display: none; }
  .ad-app.show { display: block; }

  .ad-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-3) var(--space-6);
  }
  .ad-brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-weight: 600;
    font-size: var(--text-sm);
    letter-spacing: var(--tracking-tight);
  }
  .ad-brand span {
    font-family: var(--font-mono);
    font-size: 0.625rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--color-text-tertiary);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    padding: 2px 7px;
    font-weight: 500;
  }
  .ad-search {
    margin-left: auto;
    width: 240px;
    padding: 7px var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    font-size: var(--text-sm);
    background: var(--color-surface);
    outline: none;
  }
  .ad-search:focus { border-color: var(--color-text); background: var(--color-bg); }
  .ad-logout {
    font-size: var(--text-sm);
    color: var(--color-text-tertiary);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .ad-logout:hover { color: var(--color-text); }

  /* ── Tabs ── */
  .ad-tabs {
    display: flex;
    gap: var(--space-1);
    padding: var(--space-4) var(--space-6) 0;
    max-width: 1280px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  .ad-tab {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: 7px var(--space-4);
    border-radius: var(--radius-full);
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--color-text-secondary);
    border: 1px solid transparent;
  }
  .ad-tab:hover { background: var(--color-surface); }
  .ad-tab.active {
    background: var(--color-text);
    color: var(--color-text-inverse);
  }
  .ad-tab-count {
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    opacity: 0.7;
  }

  /* ── Layout ── */
  .ad-main {
    max-width: 1280px;
    margin: 0 auto;
    padding: var(--space-5) var(--space-6) var(--space-16);
    display: grid;
    grid-template-columns: minmax(300px, 380px) 1fr;
    gap: var(--space-5);
    align-items: start;
  }
  @media (max-width: 900px) { .ad-main { grid-template-columns: 1fr; } }

  /* ── List ── */
  .ad-list {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    max-height: calc(100dvh - 160px);
    overflow-y: auto;
  }
  .ad-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--color-border-subtle);
    cursor: pointer;
  }
  .ad-item:last-child { border-bottom: none; }
  .ad-item:hover { background: var(--color-surface); }
  .ad-item.active { background: var(--color-surface); box-shadow: inset 3px 0 0 var(--color-text); }
  .ad-item-top {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    margin-bottom: 3px;
  }
  .ad-item-name {
    font-size: var(--text-sm);
    font-weight: 600;
    letter-spacing: var(--tracking-tight);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ad-item-date {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.625rem;
    color: var(--color-text-tertiary);
    flex-shrink: 0;
  }
  .ad-item-sub {
    font-size: var(--text-xs);
    color: var(--color-text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: var(--space-2);
  }
  .ad-item-specs { display: flex; gap: 4px; flex-wrap: wrap; }

  .pill {
    font-size: 0.625rem;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    color: var(--color-text-secondary);
    background: var(--color-bg);
    white-space: nowrap;
    font-weight: 500;
  }
  .pill.status-pending  { background: var(--color-neutral-bg);  color: var(--color-neutral);  border-color: transparent; }
  .pill.status-reviewing{ background: var(--color-caution-bg);  color: var(--color-caution);  border-color: transparent; }
  .pill.status-approved { background: var(--color-positive-bg); color: var(--color-positive); border-color: transparent; }
  .pill.status-rejected { background: var(--color-negative-bg); color: var(--color-negative); border-color: transparent; }

  /* ── Detail ── */
  .ad-detail {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-8);
    min-height: 400px;
  }
  .ad-empty {
    display: grid;
    place-items: center;
    min-height: 340px;
    color: var(--color-text-tertiary);
    font-size: var(--text-sm);
    text-align: center;
  }

  .ad-d-head {
    display: flex;
    align-items: flex-start;
    gap: var(--space-4);
    padding-bottom: var(--space-5);
    border-bottom: 1px solid var(--color-border);
    margin-bottom: var(--space-6);
    flex-wrap: wrap;
  }
  .ad-d-name {
    font-size: var(--text-xl);
    font-weight: var(--display-weight);
    letter-spacing: var(--tracking-display);
    margin-bottom: 2px;
  }
  .ad-d-mail { font-size: var(--text-sm); color: var(--color-text-secondary); }
  .ad-d-mail a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

  .ad-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: var(--space-5);
    margin-bottom: var(--space-6);
  }
  .ad-cell-label {
    font-family: var(--font-mono);
    font-size: 0.625rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    margin-bottom: 5px;
  }
  .ad-cell-value { font-size: var(--text-sm); color: var(--color-text); }
  .ad-cell-value a { color: var(--color-text); text-decoration: underline; text-underline-offset: 2px; }
  .ad-cell-value.muted { color: var(--color-text-tertiary); }

  .ad-block { margin-bottom: var(--space-6); }
  .ad-block-title {
    font-family: var(--font-mono);
    font-size: 0.625rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    margin-bottom: var(--space-3);
  }
  .ad-prose {
    font-size: var(--text-sm);
    line-height: 1.7;
    color: var(--color-text);
    white-space: pre-wrap;
    background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    max-width: none;
  }

  .ad-notes {
    width: 100%;
    min-height: 84px;
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    font-family: var(--font-body);
    resize: vertical;
    outline: none;
    line-height: 1.6;
  }
  .ad-notes:focus { border-color: var(--color-text); }

  .ad-actions {
    display: flex;
    gap: var(--space-2);
    padding-top: var(--space-5);
    border-top: 1px solid var(--color-border);
    flex-wrap: wrap;
    align-items: center;
  }
  .ad-btn {
    padding: 9px var(--space-5);
    border-radius: var(--radius-full);
    font-size: var(--text-sm);
    font-weight: 500;
    border: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .ad-btn:hover { border-color: var(--color-text); }
  .ad-btn.approve { background: var(--color-text); color: var(--color-text-inverse); border-color: var(--color-text); }
  .ad-btn.approve:hover { background: var(--color-accent-hover); }
  .ad-btn.reject:hover { border-color: var(--color-error); color: var(--color-error); }
  .ad-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .ad-save-msg {
    font-size: var(--text-xs);
    color: var(--color-text-tertiary);
    margin-left: auto;
  }
  .ad-kbd {
    font-family: var(--font-mono);
    font-size: 0.625rem;
    border: 1px solid var(--color-border);
    border-bottom-width: 2px;
    border-radius: var(--radius-sm);
    padding: 1px 5px;
    color: var(--color-text-tertiary);
    margin-left: 4px;
  }

  body { --color-text-tertiary:#686e62; --color-neutral:#62695b; --color-caution:#795e25; }
  .ad-gate-intro { font-size:14px; color:#686e62; line-height:1.7; margin:0 0 24px; }
  .ad-password-label { display:block; font-size:14px; margin-bottom:8px; }
  .ad-home { display:inline-block; margin-top:18px; font-size:13px; text-decoration:underline; }
  .ad-input,.ad-search,.ad-notes { font-size:16px; }
  .ad-btn,.ad-tab,.ad-collection,.ad-logout { min-height:44px; }
  .ad-btn { border-radius:7px; }
  .ad-bar { flex-wrap:wrap; }
  .ad-brand { color:inherit; text-decoration:none; }
  .ad-intro,.ad-collections,.ad-feedback { max-width:1280px; margin:0 auto; padding:0 24px; }
  .ad-intro { padding-top:32px; padding-bottom:24px; }
  .ad-intro h1 { font-size:32px; font-weight:400; letter-spacing:-.035em; margin:0 0 10px; }
  .ad-intro p { color:#686e62; font-size:14px; }
  .ad-collections { display:flex; gap:20px; }
  .ad-collection { padding:0 0 10px; border-bottom:2px solid transparent; font-size:15px; color:#686e62; }
  .ad-collection.active { color:#242620; border-color:#242620; }
  .ad-feedback { min-height:24px; padding-top:12px; font-size:14px; color:#686e62; }
  .ad-feedback.error { color:#a1392f; }
  .ad-main { grid-template-columns:minmax(280px,360px) minmax(0,1fr); }
  .ad-queue,.ad-detail { min-width:0; }
  .ad-item-sub,.ad-item-date,.pill,.ad-cell-label,.ad-block-title { font-size:12px; }
  .ad-item-name,.ad-cell-value,.ad-prose { font-size:14px; }
  .ad-cell-value,.ad-d-mail,.ad-prose { overflow-wrap:anywhere; }
  .ad-pagination { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .ad-pagination .ad-btn { padding:8px 12px; font-size:12px; }
  #page-info { font-size:12px; color:#686e62; text-align:center; }
  #tabs[hidden] { display:none; }
  .ad-back-list { display:none; }
  :is(button,a,input,textarea):focus-visible { outline:2px solid #62734f; outline-offset:3px; }
  @media(max-width:900px) { .ad-main { grid-template-columns:1fr; } .ad-list { max-height:440px; } .ad-back-list { display:inline-flex; margin-bottom:20px; } }
  @media(max-width:600px) {
    .ad-bar { padding:12px 16px; gap:12px; }
    .ad-search { order:4; width:100%; margin:0; }
    #refresh { margin-left:auto; padding:8px 12px; }
    .ad-main,.ad-intro,.ad-collections,.ad-feedback,.ad-tabs { padding-left:16px; padding-right:16px; }
    .ad-detail { padding:20px; }
    .ad-tab { padding:7px 12px; font-size:13px; }
    .ad-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .ad-empty { min-height:180px; padding:24px; }
  }
</style>
</head>
<body>
<main>

<!-- Login -->
<div class="ad-gate" id="gate">
  <form class="ad-gate-card" id="gate-form" method="post" action="/api/admin/login">
    <div class="ad-gate-kicker">World Labs</div>
    <h1 class="ad-gate-title">Community inbox</h1>
    <p class="ad-gate-intro">Sign in to review applications and waitlist signups.</p>
    <label for="pw" class="ad-password-label">Admin password</label>
    <input class="ad-input" id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required aria-describedby="gate-err">
    <button type="submit" class="btn btn-primary" id="gate-btn" disabled>Sign in</button>
    <div class="ad-gate-err" id="gate-err" role="status" aria-live="polite"></div>
    <a class="ad-home" href="/">Back to site</a>
  </form>
</div>

<noscript><style>#gate-form { display:none; }</style><p class="ad-empty">Enable JavaScript to use the admin inbox.</p></noscript>

<!-- App -->
<div class="ad-app" id="app">
  <div class="ad-bar">
    <a class="ad-brand" href="/">World Labs <span>Admin</span></a>
    <input class="ad-search" id="search" aria-label="Search submissions" type="search" placeholder="Search name, email, credits…">
    <button type="button" class="ad-btn" id="refresh">Refresh</button>
    <button type="button" class="ad-logout" id="logout">Sign out</button>
  </div>

  <header class="ad-intro"><h1>Community inbox</h1><p>Applications and signups, ready to review.</p></header>
  <div class="ad-collections" aria-label="Submission type">
    <button type="button" class="ad-collection active" data-kind="applications" aria-pressed="true">Applications</button>
    <button type="button" class="ad-collection" data-kind="waitlist" aria-pressed="false">Waitlist</button>
  </div>
  <div class="ad-tabs" id="tabs" aria-label="Application status"></div>
  <p class="ad-feedback" id="feedback" role="status" aria-live="polite"></p>

  <div class="ad-main">
    <div class="ad-queue">
      <div class="ad-list" id="list" aria-label="Submissions"></div>
      <div class="ad-pagination"><button class="ad-btn" id="previous" type="button">Previous</button><span id="page-info"></span><button class="ad-btn" id="next" type="button">Next</button></div>
    </div>
    <section class="ad-detail" id="detail" aria-label="Selected submission">
      <div class="ad-empty">Select an application to review.</div>
    </section>
  </div>
</div>

</main>
<script type="module" src="./scripts/admin.js"></script>

</body>
</html>
